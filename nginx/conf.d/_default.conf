server {
    # Escuta nas portas 80 (IPv4 e IPv6)
    listen 80 default_server;
    listen [::]:80 default_server;

    # Nome do servidor (substitua pelo seu domínio se necessário)
    server_name _;

    # Diretório raiz dos arquivos
    root /var/www/html;

    # Arquivo de índice padrão
    index index.html index.htm;

    # Configuração principal para o diretório raiz
    location / {
        try_files $uri $uri/ =404;
    }

    # Bloqueio para arquivos ocultos (como .htaccess, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Configuração para cache de arquivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Páginas de erro customizadas
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}